<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打靶射击场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;user-select:none;}
.wrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
.top{display:flex;gap:36px;color:#eee;font-size:18px;font-weight:700;}
.top span{color:#e94560;font-size:26px;min-width:50px;text-align:center;}
canvas{border:3px solid #e94560;border-radius:12px;cursor:crosshair;box-shadow:0 0 40px rgba(233,69,96,.25);background:linear-gradient(180deg,#0d1b2a 0%,#1b2838 100%);}
.hint{color:#777;font-size:13px;letter-spacing:1px;}
.btn{background:#e94560;color:#fff;border:none;padding:10px 32px;border-radius:6px;font-size:16px;cursor:pointer;font-weight:700;letter-spacing:1px;transition:all .2s;}
.btn:hover{background:#ff6b81;transform:scale(1.05);}
.btn:active{transform:scale(.95);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>🎯 <span id="score">0</span></div>
    <div>⏱ <span id="timer">30</span>s</div>
    <div>🏆 <span id="best">0</span></div>
    <div>🔥 <span id="combo">0</span>x</div>
  </div>
  <canvas id="game" width="700" height="450"></canvas>
  <div class="hint" id="hint">点击靶子得分！连续命中触发连击加成 🔥</div>
  <button class="btn" id="startBtn">开始游戏</button>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height;

let targets=[],score=0,combo=0,maxCombo=0,best=parseInt(localStorage.getItem('shootBest')||'0');
let timeLeft=30,playing=false,frame=0;
let particles=[],shakeAmount=0;
let lastClick=0;

function spawnTarget(){
  const r=18+Math.random()*24;
  const x=r+Math.random()*(W-r*2);
  const y=r+Math.random()*(H-r*2-40)+20;
  const type=Math.random()<.12?'gold':Math.random()<.22?'fast':'normal';
  const life=type==='fast'?35:type==='gold'?50:55;
  const points=type==='gold'?30:type==='fast'?15:10;
  targets.push({x,y,r,type,life,maxLife:life,points,dirX:(Math.random()-.5)*1.5,dirY:(Math.random()-.5)*1.5});
}

function spawnParticles(x,y,count,color){
  const n=Math.min(count,12);
  for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6-2,life:1,decay:.03+Math.random()*.04,size:2+Math.random()*4,color});
}

function startGame(){
  score=0;combo=0;maxCombo=0;timeLeft=30;playing=true;
  targets=[];particles=[];
  document.getElementById('score').textContent='0';
  document.getElementById('timer').textContent='30';
  document.getElementById('timer').style.color='#eee';
  document.getElementById('combo').textContent='0';
  document.getElementById('startBtn').style.display='none';
  document.getElementById('hint').textContent='狂点靶子！🎯';
  for(let i=0;i<3;i++)spawnTarget();
}

canvas.addEventListener('click',e=>{
  if(!playing)return;
  const now=Date.now();
  if(now-lastClick<30)return;
  lastClick=now;
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let hit=false;
  for(let i=targets.length-1;i>=0;i--){
    const t=targets[i];
    if((mx-t.x)**2+(my-t.y)**2<t.r*t.r){
      combo++;if(combo>maxCombo)maxCombo=combo;
      const bonus=combo>=10?t.points*3:combo>=5?t.points*2:t.points;
      score+=bonus;
      document.getElementById('score').textContent=score;
      document.getElementById('combo').textContent=combo;
      spawnParticles(t.x,t.y,8+Math.min(combo,8),t.type==='gold'?'#ffd700':'#e94560');
      shakeAmount=Math.min(4,combo*.3);
      targets.splice(i,1);
      spawnTarget();
      if(targets.length<4)spawnTarget();
      hit=true;
      break;
    }
  }
  if(!hit){
    combo=0;document.getElementById('combo').textContent='0';
    if(Math.random()<.3)spawnParticles(mx,my,3,'#666');
  }
});

let hoverFrame=0;
canvas.addEventListener('mousemove',()=>{
  if(!playing)return;
  hoverFrame++;
  if(hoverFrame%3!==0)return;
  canvas.style.cursor='crosshair';
  for(let t of targets){
    const dx=0,dy=0;
    canvas.style.cursor='pointer';break;
  }
});

function update(){
  if(!playing)return;
  frame++;
  if(shakeAmount>.02)shakeAmount*=.85;else shakeAmount=0;

  if(frame%60===0){
    timeLeft--;
    document.getElementById('timer').textContent=timeLeft;
    if(timeLeft<=5)document.getElementById('timer').style.color='#ff4444';
    if(timeLeft<=0){gameOver_();return;}
  }

  for(let t of targets){
    t.life--;
    t.x+=t.dirX;t.y+=t.dirY;
    if(t.x<t.r||t.x>W-t.r)t.dirX*=-1;
    if(t.y<t.r||t.y>H-t.r)t.dirY*=-1;
  }
  targets=targets.filter(t=>t.life>0);
  const maxTargets=Math.min(8,3+Math.floor(score/15));
  while(targets.length<maxTargets)spawnTarget();

  for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=p.decay;}
  particles=particles.filter(p=>p.life>0);
  if(particles.length>120)particles=particles.slice(-100);
}

function gameOver_(){
  playing=false;
  if(score>best){best=score;localStorage.setItem('shootBest',best);}
  document.getElementById('best').textContent=best;
  document.getElementById('timer').textContent='0';
  document.getElementById('timer').style.color='#e94560';
  document.getElementById('startBtn').style.display='inline-block';
  document.getElementById('startBtn').textContent='再来一局';
  document.getElementById('hint').textContent=`最终得分 ${score} | 最大连击 ${maxCombo}x 🔥`;
  for(let i=0;i<30;i++)particles.push({x:W/2,y:H/2,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*8-4,life:1,decay:.02+Math.random()*.03,size:3+Math.random()*5,color:'#ffd700'});
}

function draw(){
  ctx.clearRect(0,0,W,H);

  const sx=shakeAmount*(Math.random()-.5),sy=shakeAmount*(Math.random()-.5);
  ctx.save();ctx.translate(sx,sy);

  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  for(let t of targets){
    const alpha=t.life/t.maxLife;
    const pulse=1+Math.sin(frame*.15)*.06;
    ctx.globalAlpha=alpha;
    if(t.type==='gold'){
      ctx.fillStyle='#ffd700';ctx.strokeStyle='#b8860b';
    }else if(t.type==='fast'){
      ctx.fillStyle='#e94560';ctx.strokeStyle='#8b0000';
    }else{
      ctx.fillStyle='#4ecca3';ctx.strokeStyle='#1a6b4a';
    }
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*pulse,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=2;ctx.stroke();

    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*.55,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(t.x,t.y,t.r*.25,0,Math.PI*2);ctx.stroke();

    ctx.fillStyle='#fff';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText(t.type==='gold'?'3x':t.points,t.x,t.y+4);
  }
  ctx.globalAlpha=1;

  for(let p of particles){
    ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.restore();

  const barW=W*.7,barH=8,barX=(W-barW)/2,barY=H-18;
  ctx.fillStyle='rgba(255,255,255,.1)';
  ctx.fillRect(barX,barY,barW,barH);
  const pct=timeLeft/30;
  ctx.fillStyle=pct>.5?'#4ecca3':pct>.2?'#f39c12':'#e94560';
  ctx.fillRect(barX,barY,barW*pct,barH);
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.strokeRect(barX,barY,barW,barH);

  if(!playing&&timeLeft===30){
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#eee';ctx.font='bold 32px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('🎯 打靶射击场',W/2,H/2-30);
    ctx.fillStyle='#888';ctx.font='18px "Segoe UI"';
    ctx.fillText('点击靶子得分，连击翻倍，30秒限时！',W/2,H/2+15);
    ctx.fillText(`历史最高：${best} 分`,W/2,H/2+45);
  }

  if(!playing&&timeLeft===0){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffd700';ctx.font='bold 46px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.fillStyle='#eee';ctx.font='24px "Segoe UI"';
    ctx.fillText(`得分: ${score}  |  连击: ${maxCombo}x`,W/2,H/2+25);
    ctx.fillStyle='#888';ctx.font='16px "Segoe UI"';
    ctx.fillText('点击"再来一局"继续',W/2,H/2+55);
  }
}

document.getElementById('startBtn').addEventListener('click',startGame);
function loop(){update();draw();requestAnimationFrame(loop);}
document.getElementById('best').textContent=best;
loop();
</script>
</body>
</html>
